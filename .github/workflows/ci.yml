name: Verification

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, property, architecture and PostgreSQL integration tests
        run: ./gradlew check
      - name: Mutation tests (minimum 80 percent)
        run: ./gradlew pitest
      - name: TLA+ model checking
        run: ./gradlew tlcCheck
      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/pitest/
            build/tlc/
