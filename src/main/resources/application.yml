spring:
  application:
    name: care-connect-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    placeholders:
      applicationUser: ${DB_USERNAME}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

security:
  jwt-secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
